# WORKFLOW_REGISTRY.yaml — AI-OS TOP-INSTAL
#
# Compact schema per entry (expand fields only when the workflow genuinely has: concurrent
# implementations, recovery, concurrency control, multiple terminal states, a cross-repo
# contract, or non-trivial policy — do not pad every entry to the full brief.md §7 schema):
#
# workflow_id:      stable slug, SCREAMING-KEBAB, e.g. GMAIL-SIGNAL-INTAKE
# domain:           one of the 9 domains in PROGRESS.md
# owner:            owning repo
# status:           LIVE_PATH | CONDITIONAL_PATH | FALLBACK_PATH | TEST_ONLY | PROOF_ONLY |
#                    LEGACY_PATH | DORMANT_PATH | DEAD_PATH | BROKEN_CALL | MISSING_PRODUCER |
#                    MISSING_CONSUMER | MISSING_EXECUTOR | RUNTIME_UNVERIFIED | RUNTIME_CONFIRMED
#                    (a workflow may carry more than one, e.g. [LIVE_PATH, RUNTIME_CONFIRMED])
# entrypoints:      [repo/file:symbol, ...]
# uses:             [SUBFLOW-ID, ...]        — shared step sequences, see SUBFLOWS below
# steps:            [short verbs] — omit steps already covered by a referenced subflow
# state_reads:      [table/store/fact_key, ...]
# state_writes:     [table/store/fact_key, ...]
# external_calls:   [repo/service via transport, ...] — cross-repo only
# side_effect:      one line or none
# policy:           auth/policy gate name, or none
# approval:         HITL gate name, or none
# terminal:         [success states] / [failure states]
# retry:            mechanism or "none found"
# consumers:        [who reads the terminal result]
# evidence_ids:     [EV-#####, ...]
# gaps:             [short gap labels] or omit
# runtime:          RUNTIME_CONFIRMED <cite> | RUNTIME_UNVERIFIED | n/a
#
# SUBFLOWS: named, reusable step sequences referenced via `uses:` instead of being
# copy-pasted into every workflow that starts the same way. Defined in the `subflows:` map
# below, filled in as they're identified during domain reconstruction.

subflows:
  SUBFLOW-CASE-INTELLIGENCE-TO-AGENT-HANDOFF:
    description: >
      FORMAL BOUNDARY: Domain 2 (Case/memory) -> Domain 3 (Understanding/decision/planner/agent
      runtime). Everything before this subflow is Case/Identity/Engagement/Intelligence
      resolution; everything after is the agent execution loop itself. Location:
      agent_runtime/agent_reconcile.py:606-650, inside run_agent_reconcile, after Block 1
      (case intelligence) and Block 2 (policy envelope) have both resolved (successfully or
      degraded, EV-00054/55) and before Block 3 (EV-00056) invokes execute_agent_run.
    handoff_contract:
      target_call: "execute_agent_run(resolution.engagement_id, store=operator_store, signal=agent_signal, settings=settings, mailbox_store=mailbox_store, require_enabled=False)"
      agent_signal_base: "signal_payload_for_agent(signal, intake) — base fields not individually enumerated this pass"
      agent_signal_added_fields:
        - "policy_action_envelope: PolicyActionEnvelopeV1 dict (from Block 2; freshness='unavailable' + reason_codes=[...] if Block 2 degraded, EV-00055)"
        - "understanding_brief_pl: str, from (case_intelligence_result.get('operator_brief') or {}).get('brief_pl') or '' — empty string if Block 1 failed/skipped (EV-00054)"
        - "case_understanding_projection: build_case_understanding_projection(case_intelligence_result, message_id=...) — projection-safe extract, empty/default shape if Block 1 failed"
        - "case_understanding_provenance: build_case_understanding_provenance_projection(case_intelligence_result, message_id=...)"
        - "decision_comparison_inputs: build_decision_comparison_inputs(case_intelligence_result, message_id=...)"
      integrity_note: >
        None of these 4 added fields carry an explicit 'this is degraded' marker of their own
        (unlike policy_action_envelope's freshness field) when case_intelligence_result is {} —
        they resolve to empty/default shapes that are structurally identical to a case that
        genuinely has nothing new, not to an explicit failure state. This is the concrete
        mechanism behind Block 1's PARTIAL_FAILURE_MASKED_AS_SUCCESS classification (EV-00054).
    evidence_ids: [EV-00047, EV-00054, EV-00055]

  SUBFLOW-CASE-LINK-ROUTE-DECISION:
    description: >
      Shared deterministic case-linking + routing decision used before choosing agent vs
      staging vs legacy reconcile. Not gmail-specific despite being reached first from the
      gmail dispatcher — orchestrator.route_signal takes any source_kind.
    steps:
      - "resolve_case_id_for_agent(signal, entity_link_dict, ...) — priority chain: entity_link/payload case_id -> case_proposal.case_id -> extract_case_id_from_signal heuristic -> VERIFIED entity_link -> mailbox_store.fetch_case_by_message_id DB lookup -> '' (orphan)"
      - "orchestrator.route_signal(signal, entity_link=..., case_id=..., link_confidence=...) -> OrchestratorDecision.route in {defer, fast_link, deep_understand}"
      - "has case_id -> always fast_link; no case_id + gmail/calendar source -> always deep_understand (staging); no case_id + drive -> deep_understand; triage defer overrides everything first"
    evidence_ids: [EV-00042, EV-00043, EV-00123, EV-00124]
    gaps:
      - "RESOLVED (EV-00124): mailbox_store IS confirmed omitted (defaults to None) at the gmail-dispatcher call site (signal_reconciler.py:322) — step 5 (DB fetch_case_by_message_id fallback) is confirmed DEAD on that specific path. The sibling call site (agent_reconcile.py:554) DOES pass a real mailbox_store and would reach step 5. Not a blanket unreachability claim — split by call site, precisely as now stated."
      - "RESOLVED (EV-00123): FAST_LINK_CONFIDENCE = 0.92 default, overridable via ORCHESTRATOR_FAST_LINK_CONFIDENCE env var. Its actual effect is narrower than the name suggests: once a case_id already exists (cid truthy), route_signal ALWAYS returns fast_link regardless of confidence — the threshold only changes the reason label ('linked_high_confidence' vs 'existing_case_id'), not the routing outcome. The threshold only gates the ACTUAL route decision when NO case_id exists yet (line 62): route reaches fast_link via 'deterministic_link' only if conf>=0.92 AND status in {deterministic,verified}; otherwise orphan gmail/calendar/drive signals fall through to deep_understand staging."

  SUBFLOW-SHARED-DOWNSTREAM-STAGES:
    description: >
      The canonical "Case Intelligence pipeline" — intake_shared_downstream.run_shared_downstream_stages
      (intake_shared_downstream.py:122-321). Called from BOTH the legacy reconcile path
      (_reconcile_gmail_legacy_prepare) AND the agent-runtime path
      (_run_mailbox_intelligence_downstream, EV-00045) — genuinely shared, not duplicated logic.
      This IS "Brain 1" per ARCHITECTURE_DECISIONS.md's informal framing; not used as a formal
      name here since it is not a literal identifier in THIS file (contrast SUBFLOW's sibling
      _BRAIN1_OWNED_SNAPSHOT_FIELDS in graph.py, EV-00065, which is literal).
    steps:
      - "link_case_context -> ingest_mailbox_memory (produces stage_config['mailbox_memory_context_pack'], EV-00066, closes EV-00034)"
      - "Stage 1: run_business_reasoning (LLM, independent)"
      - "Stage 2: draft_reply (LLM, depends on business_result; skippable via opts.skip_draft_reply)"
      - "Stage 3: plan_actions/ActionPlanner (deterministic, depends on business_result + reply_result)"
      - "Stage 4: build_case_intelligence_layer/Understanding (LLM, depends on ALL 3 prior stage outputs — runs LAST, guarded by its own try/except with fallback_case_intelligence_result)"
      - "finalize_mailbox_memory -> hot_state merge (mode-dependent) -> attach_policy_and_proposals (Policy stage)"
    evidence_ids: [EV-00066, EV-00067, EV-00068, EV-00069, EV-00070, EV-00071]
    gaps:
      - "CONFIRMS brief.md P0/HIGH item §6.2 (Draft+ActionPlanner before Understanding) as CONFIRMED_OPEN in current code, function relocated to intake_shared_downstream.py (not gmail_intake.py:2800-2920 literally anymore)"
      - "ThreadPoolExecutor infrastructure achieves no real concurrency given the sequential .result() awaits (EV-00068) — naming/expectation mismatch, not a correctness bug"
      - "RESOLVED (EV-00070/71): attach_policy_and_proposals reads decision_pipeline from INSIDE case_intelligence_result (not a separate stage call); gates PolicyDecision + ActionProposalV2 creation on a real decision_candidate existing; dry_run_only defaults True in code but is RUNTIME_CONFIRMED False on the live worker (real, non-dry-run proposals are live-reachable). Divergence detection specifically not yet traced as a separate mechanism beyond Domain 1/2's learning-loop evidence (EV-00008..12) — carried forward to Domain 9."

  SUBFLOW-GMAIL-SIGNAL-RECONCILE:
    description: >
      Durable, per-signal reconcile pipeline shared by every source_kind (gmail, drive,
      calendar, ...). Entry: signal_reconciler.reconcile_signal(signal, runtime_context, dry_run).
    steps:
      - "_maybe_cleanup_staging_engagements(runtime_context) — TTL garbage collection, not a visibility gate (per ARCHITECTURE_DECISIONS.md, not yet independently verified)"
      - "journal.record_processing_attempt(status='started') — durable attempt record written before any handler runs"
      - "entity link: apply_entity_link(...) when runtime_context.persist_entity_links else EntityLinker(...).find_case(signal) (read-only variant)"
      - "dispatch: SIGNAL_HANDLERS[signal.source_kind](signal, runtime_context, dry_run, entity_link_dict) — registry-pattern lookup, raises ValueError if source_kind unregistered"
      - "journal.record_processing_attempt(status=result.processing_state) on success"
      - "journal.record_processing_attempt(status='failed', error_text=str(exc)) then re-raise on any exception — failure is not swallowed at this layer"
    evidence_ids: [EV-00019, EV-00020]
    gaps:
      - "RESOLVED_BY: EV-00028, EV-00029 — SIGNAL_HANDLERS registration fully enumerated (decorator pattern, 4 handlers: gmail signal_reconciler.py:295, calendar:819, operator_command:886, drive:1052, all unconditional at module-import time, no env/feature-flag gating)."

