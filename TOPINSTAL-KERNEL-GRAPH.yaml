  Legacy folder names in wiki_refs (topinstal-cieplo-orchestrator/, RAG Chat Asystent/) are historical.
  Monorepo paths: cieplo-orchestrator/, rag-chat-asystent/, daszek/docs/core/PROJECT_README.md.
