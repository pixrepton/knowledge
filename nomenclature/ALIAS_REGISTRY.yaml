# TOP-INSTAL — rejestr aliasów L3 → L2
# Governance faza 2. Nie zmienia kodu w 5 repo.
version: 1
updated: "2026-05-22"
schema: topinstal-nomenclature-alias-registry
source_discovery: discovery/2026-05-22-nomenclature-discovery-report.md

# Pola wpisu:
#   canonical: ID z CANONICAL_GLOSSARY.md (L2)
#   repo: gmail-agent | kalk-top | orchestrator | generator | rag
#   token: dokładny symbol w kodzie (L3)
#   kind: column | field | class | function | table | route | env | contract | payload_type
#   immutable: true = zakaz rename bez RFC + impact
#   display_only: true = można zmienić etykietę UI/API v2, nie schema DB/kontraktu
#   ui_label_pl: zalecana etykieta L1 (nowe UI)
#   file_hint: reprezentatywna ścieżka (Desktop-relative)

