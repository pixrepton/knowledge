# Greenfield (L2 only — brak L3 do czasu RFC P0)
greenfield:
  - canonical: os.identity_id
    status: proposed
    forbidden_aliases: [user_id, lead_id, client_id]
  - canonical: os.engagement_id
    status: proposed
    forbidden_aliases: [lead_id, case_id, global_lead_id]
  - canonical: os.correlation_link
    status: proposed
    table: correlation_links
  - canonical: os.canonical_trace_id
    status: proposed
    maps_aliases: [traceId, trace_id]
