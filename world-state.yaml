      - knowledge/artifacts/proof-packs/
    backlog:
      - knowledge/CLOSEOUT_8_PROJECTS_TOP_INSTAL.md
    code_facts:
      - daszek/daszek.php # DASZEK_VERSION
      - fast-kalk/wp-content/plugins/topinstal-lead-widget/topinstal-lead-widget.php
      - gmail-agent/tools/gmail_audit/agent_hitl_bridge.py # HITL send wired check
      - top-instal-generator/core/application/OfferDocumentInputMapper.php
    git:
      - per-repo HEAD SHA # kalk-top, daszek, gmail-agent, knowledge
    optional:
      - knowledge/ARCHITECTURE_FRESHNESS.md
      - GitNexus group impact

  # Files that become VIEWS — generated from or validated against world-state
  views:
    narrative:
      - knowledge/reviews/full-ecosystem-audit.md
      - knowledge/CLOSEOUT_8_PROJECTS_TOP_INSTAL.md
      - knowledge/SYSTEM_ATLAS.md    epistemic:
      - knowledge/CONTROL_PLANE.md # rules how to read layers — not duplicated here
      - knowledge/source-of-truth.md # matrix expands ownership — pointer to world-state
    session:
      - knowledge/memory/ACTIVE_WORKSPACE.md
      - knowledge/memory/LAST_SESSION.md
      - knowledge/memory/engrams/
    ui:
      - canvases/*.canvas.tsx # render world-state + drift
    deprecated_as_parallel_sot:
      - ECOSYSTEM_MAP.yaml # merge into world-state; keep verify commands only

  refresh_triggers:
    - after_cross_repo_merge
    - after_LPS_update
    - after_CLOSEOUT_refresh
    - session_end_hook # delta only

  outputs:
    - knowledge/world-state.yaml
    - optional: knowledge/world-state.drift-report.json

# ---------------------------------------------------------------------------
# FIELD METADATA — for compile-world-state.py
# Maps field paths to update_mode and authoritative source.
# update_mode:
#   auto  — compiler reads source and writes value directly
#   semi  — compiler reads source, but a Gate B run must have triggered it
#   manual — operator decision; compiler can flag staleness but cannot update
# ---------------------------------------------------------------------------
field_meta:
  # Top-level
  updated_at:
    update_mode: auto
    source: "date.now() at compile time"
  updated_by:
    update_mode: auto
    source: "compiler constant: script"

  # deployment section
  deployment.active:
    update_mode: manual
    source: knowledge/memory/OPERATOR_DECISIONS.md
  deployment.legacy_prod:
    update_mode: manual
    source: knowledge/memory/OPERATOR_DECISIONS.md
  deployment.target_prod:
    update_mode: manual
    source: knowledge/rfc/single-unified-vps.md
  deployment.git_push:
    update_mode: manual
    source: knowledge/CLOSEOUT_8_PROJECTS_TOP_INSTAL.md

  # local_endpoints section
  local_endpoints.gmail_agent_api:
    update_mode: manual
    source: gmail-agent/docker-compose.local-vps.yml
  local_endpoints.daszek:
    update_mode: manual
    source: docker-compose.daszek-local.yml
  local_endpoints.kalk_top_runtime:
    update_mode: manual
    source: kalk-top/package.json (KALK_TOP_RUNTIME_PORT)
  local_endpoints.rag_backend:
    update_mode: manual
    source: rag-chat-asystent/docker-compose*.yml
  local_endpoints.postgres_mailbox:
    update_mode: manual
    source: gmail-agent/docker-compose.local-vps.yml

  # per-repo proof fields (pattern: repos.<name>.*)
  repos.*.proof:
    update_mode: semi
    source: gmail-agent/docs/runbooks/LAST_PROVEN_STATE.md or per-repo proof pack
    note: "compiler reads LPS section headers; only updates after Gate B trigger"
  repos.*.proof_date:
    update_mode: semi
    source: gmail-agent/docs/runbooks/LAST_PROVEN_STATE.md or per-repo proof pack
  repos.*.proof_ref:
    update_mode: manual
    source: per-repo AGENTS.md or CLOSEOUT
  repos.*.local_proof:
    update_mode: semi
    source: scripts/preflight-local-stack.ps1 exit code

  repos.gmail-agent.critical_findings_2026_07_13:
    update_mode: manual
    source: gmail-agent/docs/runbooks/LAST_PROVEN_STATE.md §Zamrożone gwarancje
    note: "local-only closure snapshot; do not extend to VPS/production without a fresh proof"

  # version_code — auto-extractable from files
  repos.gmail-agent.version_code:
    update_mode: auto
    source: "git -C gmail-agent log -1 --format=%H"
  repos.kalk-top.version_code:
    update_mode: auto
    source: 'node -e "console.log(require(''./kalk-top/package.json'').version)"'
  repos.daszek.version_code:
    update_mode: auto
    source: "Select-String 'DASZEK_VERSION' daszek/daszek.php"
  repos.fast-kalk.version_code:
    update_mode: auto
    source: "Select-String 'Version:' fast-kalk/wp-content/plugins/topinstal-lead-widget/topinstal-lead-widget.php"
  repos.top-instal-generator.version_code:
    update_mode: auto
    source: "cat top-instal-generator/composer.json | jq .version"

  # open_p0 / open_p1 — manual; compiler can flag if CLOSEOUT references differ
  repos.*.open_p0:
    update_mode: manual
    source: knowledge/CLOSEOUT_8_PROJECTS_TOP_INSTAL.md
    note: "compiler may diff CLOSEOUT P0 list vs this field and flag mismatch"
  repos.*.open_p1:
    update_mode: manual
    source: knowledge/CLOSEOUT_8_PROJECTS_TOP_INSTAL.md

  # ecosystem_p0
  ecosystem_p0:
    update_mode: manual
    source: knowledge/CLOSEOUT_8_PROJECTS_TOP_INSTAL.md (P0 mapa priorytetĂłw)

  # gaps
  gaps.D1.status:
    update_mode: manual
    source: by_design — no trigger
  gaps.D2.status:
    update_mode: manual
    source: knowledge/rfc/P1-D2-daszek-trigger-calc.md
  gaps.D3.status:
    update_mode: semi
    source: "cieplo-orchestrator/src/topinstal_cieplo_worker/ingress/processor.py + gmail-agent signal_worker.py — check if dual poller is resolved"
  gaps.D4.status:
    update_mode: manual
    source: by_design — no trigger

  # drift entries — compiler should regenerate from code_facts
  drift:
    update_mode: semi
    source: "compiler.code_facts list (daszek.php, fast-kalk plugin header, etc.)"
    note: "compiler reads version strings from code, compares to drift.*.code, flags mismatches"

  # hitl wired check (special case — code fact, not version)
  repos.gmail-agent.hitl_send_wired:
    update_mode: auto
    source: "grep 'AGENT_HITL_EXECUTE_SEND' gmail-agent/tools/gmail_audit/agent_hitl_bridge.py"
    note: "virtual field — compiler writes True/False based on grep"
